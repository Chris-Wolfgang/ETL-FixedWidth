name: PR Benchmarks

# Forward-looking perf-regression signal (#164). benchmarks.yaml graphs the BDN
# trend AFTER a merge to main (backward-looking). This workflow runs the suite on
# a PR and compares it against the gh-pages baseline, posting a delta comment and
# failing the PR if a metric regresses past the alert threshold — so a PR that
# balloons allocations or runtime is caught before merge, not after.
#
# Scoped to code that can actually move the numbers (src/**, benchmarks/**) so it
# does not run on docs/test-only PRs, and to main/vNext so it exercises release
# candidates. Full mutation-style cost is avoided by BDN's --job short.
#
# The actual gate is a retry-confirmed absolute-floor comparison (see the
# "regression gate" job below), not the vanilla action's ratio-only alert.
# ETL-Abstractions#427 showed a single noisy shared-runner sample can push
# every file-I/O benchmark 2-4x with no code change involved; a regression
# only fails this workflow if it reproduces on a second, independent sample.
#
# The confirmation is a same-runner A/B against the base branch (#355), not a
# second sample against the stored chart baseline. Comparing against gh-pages
# exposes every PR to runner-to-runner drift: on 2026-09-15 an unchanged main
# read 2.55x against its own baseline on one runner and 0.45x on another an
# hour later, so a "fresh, independent runner" only re-rolls that die. The
# confirm job instead builds and runs the base commit and the checked-out
# commit back to back on ONE runner — on a pull_request event that is the base
# tip versus GitHub's synthetic merge of the PR onto it, i.e. exactly the
# delta the merge would introduce — re-running only the methods the first sample flagged,
# with ten measured iterations each, and gates on the median (a single
# stalled disk flush moves the mean of three iterations by an order of
# magnitude and the median not at all). The stored baseline is still what the
# first sample and the delta comment compare against; it is cheap, and its
# alert only decides whether the A/B runs.

on:
  pull_request:
    branches:
      - main
      - vNext
    paths:
      # Only run on actual code changes — a version/csproj/docs-only PR can't move
      # the numbers, so it should not spend ~5 min on benchmarks.
      - 'src/**/*.cs'
      - 'benchmarks/**/*.cs'
      - '.github/workflows/pr-benchmarks.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: BDN delta vs base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # post / update the delta comment

    outputs:
      gate_failed: ${{ steps.gate1_result.outputs.failed }}
      regressed: ${{ steps.gate1_result.outputs.regressed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks.csproj

      - name: Build (Release)
        run: dotnet build -c Release --no-restore benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks.csproj

      - name: Run benchmarks
        working-directory: benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks
        # ShortRun (~3-5 min). GitHub-hosted runners are noisy, so the delta is
        # reliable for allocations and double-digit time changes; the alert
        # threshold below is set accordingly to avoid false alarms.
        run: dotnet run -c Release --no-build -- --filter "*" --job short --memory --exporters json

      - name: Merge per-class BDN reports
        id: locate
        working-directory: benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks
        run: |
          # BDN's --exporters json writes one *-report-full-compressed.json per
          # benchmark class. github-action-benchmark consumes a single file, so
          # we combine the .Benchmarks arrays into one synthetic report.
          shopt -s nullglob
          reports=(BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No BenchmarkDotNet JSON report found"
            exit 1
          fi
          echo "Merging ${#reports[@]} report(s):"
          printf '  %s\n' "${reports[@]}"
          jq -s '{
            Title: "BenchmarkDotNet combined report",
            HostEnvironmentInfo: .[0].HostEnvironmentInfo,
            Benchmarks: [.[].Benchmarks[]]
          }' "${reports[@]}" > benchmarks-result.json
          echo "report=benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/benchmarks-result.json" >> "$GITHUB_OUTPUT"

      - name: Compare against baseline & comment
        # Same action + SHA pin as benchmarks.yaml. Compares the PR result against
        # the gh-pages baseline (latest main data point) WITHOUT pushing:
        # auto-push:false + save-data-file:false leave gh-pages untouched.
        # PR-only: workflow_dispatch runs have no PR to comment on, and the
        # action errors with "Resource not accessible by integration" if it
        # tries outside a pull_request event — surfaced investigating
        # Chris-Wolfgang/ETL-Abstractions#427, where every manual dispatch of
        # this workflow failed here regardless of the actual numbers, making
        # ad-hoc re-runs look inconclusive at a glance.
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: BenchmarkDotNet
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.locate.outputs.report }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          summary-always: true
          comment-always: true
          comment-on-alert: true
          # 150% = a metric 1.5x worse than baseline. Deliberately loose because
          # GitHub-hosted runners are noisy. The action posts the comparison
          # comment but does NOT fail the job (fail-on-alert:false) — a
          # ratio-only gate false-positives on sub-millisecond/noisy-I/O
          # benchmarks (same shape as ETL-Abstractions#367; this exact gate
          # false-positived the Abstractions 0.23.2 bump at
          # Chris-Wolfgang/ETL-Abstractions#427, which turned out to be
          # runner noise, not a real regression). The absolute-floor gate
          # below is the real pass/fail signal.
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Fetch the gh-pages benchmark baseline
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          git show FETCH_HEAD:dev/bench/data.js > "$RUNNER_TEMP/baseline-data.js"

      - name: Absolute-floor regression gate (#367) - first sample
        # Floor is 200us, not Abstractions' 50us: FixedWidth's file-I/O
        # benchmarks run 500us-90ms (three orders of magnitude wider than
        # Abstractions' in-memory suite), and this floor is sized to that
        # baseline scale, not copied verbatim. It still only rescues small,
        # low-absolute-magnitude noise; it does NOT by itself clear the
        # large-absolute-magnitude I/O noise seen at higher record counts —
        # that's what the confirm-on-independent-runner job is for.
        #
        # continue-on-error: a single alert here is not trusted on its own —
        # investigating ETL-Abstractions#427 showed one real GH-hosted-runner
        # noise event can push every file benchmark 2-4x, at every record
        # count, and that a fresh runner clears completely. So a first-sample
        # alert only triggers the confirm job below; it does not fail this
        # job by itself.
        id: gate1
        continue-on-error: true
        run: |
          python3 benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/scripts/regression-gate.py \
            "${{ steps.locate.outputs.report }}" \
            "$RUNNER_TEMP/baseline-data.js" \
            1.50 \
            200000 \
            "$RUNNER_TEMP/regressed.txt"

      - name: Record gate result for the confirm job
        id: gate1_result
        if: always()
        env:
          GATE_FAILED: ${{ steps.gate1.outcome == 'failure' }}
        run: |
          echo "failed=$GATE_FAILED" >> "$GITHUB_OUTPUT"
          # One --filter glob per regressed method, space-separated (globs contain no spaces).
          regressed=""
          if [ -s "$RUNNER_TEMP/regressed.txt" ]; then
            regressed=$(tr '\n' ' ' < "$RUNNER_TEMP/regressed.txt" | sed 's/ *$//')
          fi
          echo "regressed=$regressed" >> "$GITHUB_OUTPUT"

  confirm-regression:
    name: Confirm regression (same-runner A/B against the base branch)
    needs: benchmark
    if: needs.benchmark.outputs.gate_failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BENCH_DIR: benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks
      BENCH_PROJECT: benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks.csproj
      # Space-separated --filter globs from the first sample; empty = whole suite.
      REGRESSED_GLOBS: ${{ needs.benchmark.outputs.regressed }}
    steps:
      - name: Checkout repository (full history, to locate the base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x
      - name: Locate the base commit
        # On a pull_request event HEAD is GitHub's synthetic refs/pull/N/merge
        # commit (the PR merged onto the current base tip), so the merge-base
        # with the base branch IS the base tip, and the A/B below compares the
        # base tip against the PR merged onto it — the delta the merge would
        # introduce, with the base's own drift since the fork point on both
        # sides. On workflow_dispatch HEAD is the branch tip and this is the
        # fork point instead.
        id: base
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Base commit (merge-base of origin/$BASE_REF and HEAD): $base"
      - name: Benchmark the base commit
        # A detached worktree of the base commit, built and run on THIS runner.
        # `read -ra` splits the globs without letting the shell expand them.
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          read -ra globs <<< "${REGRESSED_GLOBS:-*}"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          dotnet restore "$RUNNER_TEMP/base/$BENCH_PROJECT"
          dotnet build -c Release --no-restore "$RUNNER_TEMP/base/$BENCH_PROJECT"
          (
            cd "$RUNNER_TEMP/base/$BENCH_DIR"
            dotnet run -c Release --no-build -- --filter "${globs[@]}" --job short --iterationCount 10 --memory --exporters json
            shopt -s nullglob
            reports=(BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json)
            if [ ${#reports[@]} -eq 0 ]; then
              echo "::error::No BenchmarkDotNet JSON report found for the base commit"
              exit 1
            fi
            jq -s '{
              Title: "BenchmarkDotNet combined report (base commit)",
              HostEnvironmentInfo: .[0].HostEnvironmentInfo,
              Benchmarks: [.[].Benchmarks[]]
            }' "${reports[@]}" > "$RUNNER_TEMP/base-result.json"
          )
      - name: Benchmark the checked-out commit (same runner, immediately after)
        run: |
          set -euo pipefail
          read -ra globs <<< "${REGRESSED_GLOBS:-*}"
          dotnet restore "$BENCH_PROJECT"
          dotnet build -c Release --no-restore "$BENCH_PROJECT"
          (
            cd "$BENCH_DIR"
            dotnet run -c Release --no-build -- --filter "${globs[@]}" --job short --iterationCount 10 --memory --exporters json
            shopt -s nullglob
            reports=(BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json)
            if [ ${#reports[@]} -eq 0 ]; then
              echo "::error::No BenchmarkDotNet JSON report found for the checked-out commit"
              exit 1
            fi
            jq -s '{
              Title: "BenchmarkDotNet combined report (checked-out commit)",
              HostEnvironmentInfo: .[0].HostEnvironmentInfo,
              Benchmarks: [.[].Benchmarks[]]
            }' "${reports[@]}" > "$RUNNER_TEMP/head-result.json"
          )
      - name: Absolute-floor regression gate (#367) - same-runner A/B, median vs median (#355)
        # NOT continue-on-error: the same code on the same runner minutes
        # apart, ten iterations a side, compared by median, is the signal the
        # first sample could not give. If a benchmark still clears both the
        # ratio and the absolute floor here, the PR made it slower.
        run: |
          python3 "$BENCH_DIR/scripts/regression-gate.py" \
            "$RUNNER_TEMP/head-result.json" \
            "$RUNNER_TEMP/base-result.json" \
            1.50 \
            200000
