name: PR Benchmarks

# Forward-looking perf-regression signal (#164). benchmarks.yaml graphs the BDN
# trend AFTER a merge to main (backward-looking). This workflow runs the suite on
# a PR and compares it against the gh-pages baseline, posting a delta comment and
# failing the PR if a metric regresses past the alert threshold — so a PR that
# balloons allocations or runtime is caught before merge, not after.
#
# Scoped to code that can actually move the numbers (src/**, benchmarks/**) so it
# does not run on docs/test-only PRs, and to main/vNext so it exercises release
# candidates. Full mutation-style cost is avoided by BDN's --job short.
#
# The actual gate is a retry-confirmed absolute-floor comparison (see the
# "regression gate" job below), not the vanilla action's ratio-only alert.
# ETL-Abstractions#427 showed a single noisy shared-runner sample can push
# every file-I/O benchmark 2-4x with no code change involved; a regression
# only fails this workflow if it reproduces on a second, independent sample.
#
# The confirmation MUST be a separate job, not a second step in the same job:
# GitHub Actions only provisions a fresh runner VM per job, not per step. An
# earlier version of this workflow re-ran the benchmarks as a later step in
# the same job and both samples landed on the identical runner (confirmed via
# the BDN host-environment line: same CPU model, same run) — that is not an
# independent sample and does not actually rule out a bad-runner event.

on:
  pull_request:
    branches:
      - main
      - vNext
    paths:
      # Only run on actual code changes — a version/csproj/docs-only PR can't move
      # the numbers, so it should not spend ~5 min on benchmarks.
      - 'src/**/*.cs'
      - 'benchmarks/**/*.cs'
      - '.github/workflows/pr-benchmarks.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: BDN delta vs base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # post / update the delta comment

    outputs:
      gate_failed: ${{ steps.gate1_result.outputs.failed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks.csproj

      - name: Build (Release)
        run: dotnet build -c Release --no-restore benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks.csproj

      - name: Run benchmarks
        working-directory: benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks
        # ShortRun (~3-5 min). GitHub-hosted runners are noisy, so the delta is
        # reliable for allocations and double-digit time changes; the alert
        # threshold below is set accordingly to avoid false alarms.
        run: dotnet run -c Release --no-build -- --filter "*" --job short --memory --exporters json

      - name: Merge per-class BDN reports
        id: locate
        working-directory: benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks
        run: |
          # BDN's --exporters json writes one *-report-full-compressed.json per
          # benchmark class. github-action-benchmark consumes a single file, so
          # we combine the .Benchmarks arrays into one synthetic report.
          shopt -s nullglob
          reports=(BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No BenchmarkDotNet JSON report found"
            exit 1
          fi
          echo "Merging ${#reports[@]} report(s):"
          printf '  %s\n' "${reports[@]}"
          jq -s '{
            Title: "BenchmarkDotNet combined report",
            HostEnvironmentInfo: .[0].HostEnvironmentInfo,
            Benchmarks: [.[].Benchmarks[]]
          }' "${reports[@]}" > benchmarks-result.json
          echo "report=benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/benchmarks-result.json" >> "$GITHUB_OUTPUT"

      - name: Compare against baseline & comment
        # Same action + SHA pin as benchmarks.yaml. Compares the PR result against
        # the gh-pages baseline (latest main data point) WITHOUT pushing:
        # auto-push:false + save-data-file:false leave gh-pages untouched.
        # PR-only: workflow_dispatch runs have no PR to comment on, and the
        # action errors with "Resource not accessible by integration" if it
        # tries outside a pull_request event — surfaced investigating
        # Chris-Wolfgang/ETL-Abstractions#427, where every manual dispatch of
        # this workflow failed here regardless of the actual numbers, making
        # ad-hoc re-runs look inconclusive at a glance.
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: BenchmarkDotNet
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.locate.outputs.report }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          summary-always: true
          comment-always: true
          comment-on-alert: true
          # 150% = a metric 1.5x worse than baseline. Deliberately loose because
          # GitHub-hosted runners are noisy. The action posts the comparison
          # comment but does NOT fail the job (fail-on-alert:false) — a
          # ratio-only gate false-positives on sub-millisecond/noisy-I/O
          # benchmarks (same shape as ETL-Abstractions#367; this exact gate
          # false-positived the Abstractions 0.23.2 bump at
          # Chris-Wolfgang/ETL-Abstractions#427, which turned out to be
          # runner noise, not a real regression). The absolute-floor gate
          # below is the real pass/fail signal.
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Fetch the gh-pages benchmark baseline
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          git show FETCH_HEAD:dev/bench/data.js > "$RUNNER_TEMP/baseline-data.js"

      - name: Absolute-floor regression gate (#367) - first sample
        # Floor is 200us, not Abstractions' 50us: FixedWidth's file-I/O
        # benchmarks run 500us-90ms (three orders of magnitude wider than
        # Abstractions' in-memory suite), and this floor is sized to that
        # baseline scale, not copied verbatim. It still only rescues small,
        # low-absolute-magnitude noise; it does NOT by itself clear the
        # large-absolute-magnitude I/O noise seen at higher record counts —
        # that's what the confirm-on-independent-runner job is for.
        #
        # continue-on-error: a single alert here is not trusted on its own —
        # investigating ETL-Abstractions#427 showed one real GH-hosted-runner
        # noise event can push every file benchmark 2-4x, at every record
        # count, and that a fresh runner clears completely. So a first-sample
        # alert only triggers the confirm job below; it does not fail this
        # job by itself.
        id: gate1
        continue-on-error: true
        run: |
          python3 benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/scripts/regression-gate.py \
            "${{ steps.locate.outputs.report }}" \
            "$RUNNER_TEMP/baseline-data.js" \
            1.50 \
            200000

      - name: Record gate result for the confirm job
        id: gate1_result
        if: always()
        run: echo "failed=${{ steps.gate1.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"

  confirm-regression:
    name: Confirm regression on an independent runner
    needs: benchmark
    if: needs.benchmark.outputs.gate_failed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks.csproj

      - name: Build (Release)
        run: dotnet build -c Release --no-restore benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks.csproj

      - name: Run benchmarks
        working-directory: benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks
        run: dotnet run -c Release --no-build -- --filter "*" --job short --memory --exporters json

      - name: Merge per-class BDN reports
        id: locate
        working-directory: benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks
        run: |
          shopt -s nullglob
          reports=(BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No BenchmarkDotNet JSON report found"
            exit 1
          fi
          jq -s '{
            Title: "BenchmarkDotNet combined report (confirm)",
            HostEnvironmentInfo: .[0].HostEnvironmentInfo,
            Benchmarks: [.[].Benchmarks[]]
          }' "${reports[@]}" > benchmarks-result.json
          echo "report=benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/benchmarks-result.json" >> "$GITHUB_OUTPUT"

      - name: Fetch the gh-pages benchmark baseline
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          git show FETCH_HEAD:dev/bench/data.js > "$RUNNER_TEMP/baseline-data.js"

      - name: Absolute-floor regression gate (#367) - confirm
        # This one is NOT continue-on-error: if the regression reproduces on
        # this second, independent runner, that's real signal and the
        # workflow fails. If it clears here, the first alert was noise and
        # the workflow passes (the "benchmark" job above already succeeded
        # for everything except this gate, per continue-on-error there).
        run: |
          python3 benchmarks/Wolfgang.Etl.FixedWidth.Benchmarks/scripts/regression-gate.py \
            "${{ steps.locate.outputs.report }}" \
            "$RUNNER_TEMP/baseline-data.js" \
            1.50 \
            200000
