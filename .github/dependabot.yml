version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  # Keep third-party GitHub Actions pinned in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the hash-pinned pip tooling (zizmor, semgrep) under .github/requirements
  # up to date. Without this the --require-hashes pins never move, leaving both
  # tools frozen at whatever version was current when they were pinned;
  # Dependabot regenerates the hashes along with the versions.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      pip-tooling:
        patterns:
          - "*"
    # semgrep pins mcp==1.29.0 and opentelemetry-instrumentation-requests~=0.58b0,
    # while semgrep.txt lifts both past the Dependabot alerts fixed in #583, #650
    # and #651 (the workflow installs with --no-deps). No resolver can satisfy
    # both, so every weekly pip-tooling run fails with
    # dependency_file_not_resolvable. These three move by hand (version and hash
    # lines only) until semgrep relaxes its pins.
    ignore:
      - dependency-name: "semgrep"
      - dependency-name: "mcp"
      - dependency-name: "opentelemetry-*"
