version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
    # The unit tests' netcoreapp3.1 / net5.0 slot pins xunit.runner.visualstudio 2.4.5: 2.5+ ships
    # no netcoreapp3.1 asset, so that slot runs zero tests and Stage 1 fails (#746). The other
    # pre-net8.0 slots are already on 2.8.2 (the last 2.x) and net8.0+ on 3.x, so this blocks nothing else.
    ignore:
      - dependency-name: "xunit.runner.visualstudio"
        versions: [">= 2.5.0, < 3.0.0"]

  # Keep third-party GitHub Actions pinned in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the hash-pinned pip tooling (zizmor, semgrep) under .github/requirements
  # up to date. Without this the --require-hashes pins never move, leaving both
  # tools frozen at whatever version was current when they were pinned;
  # Dependabot regenerates the hashes along with the versions.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      pip-tooling:
        patterns:
          - "*"
    # semgrep pins mcp==1.29.0 and opentelemetry-instrumentation-requests~=0.58b0,
    # while semgrep.txt lifts both past the Dependabot alerts fixed in #583, #650
    # and #651 (the workflow installs with --no-deps). No resolver can satisfy
    # both, so every weekly pip-tooling run fails with
    # dependency_file_not_resolvable. These three move by hand (version and hash
    # lines only) until semgrep relaxes its pins.
    ignore:
      - dependency-name: "semgrep"
      - dependency-name: "mcp"
      - dependency-name: "opentelemetry-*"
